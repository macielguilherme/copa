    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #ADFF2F;
        }

        .brutal-border {
            border: 2px solid #ADFF2F;
        }

        .brutal-shadow {
            box-shadow: 4px 4px 0px 0px #ADFF2F;
        }

        .sticker-card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }
    </style>
    <style>
        body {
            min-height: 100dvh;

<body
    class="bg-background text-on-background font-body-md custom-scrollbar selection:bg-primary-container selection:text-on-primary-container">
    <!-- TopAppBar -->
    <header
        class="bg-black/80 backdrop-blur-md fixed top-0 left-0 z-50 flex justify-between items-center w-full px-4 h-20 border-b-2 border-[#ADFF2F]">
        <div class="flex items-center gap-4">
            <h1 class="font-['Space_Grotesk'] font-black uppercase tracking-tighter text-2xl italic text-[#ADFF2F]">
                Minhas Figurinhas</h1>
        </div>
    </header>
    <main class="pt-24 pb-12 px-4 max-w-7xl mx-auto space-y-lg">
        <!-- Simple Progress Tracker -->
        <section class="bg-surface-container p-sm border-2 border-[#ADFF2F] brutal-shadow">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-sm">
                <div class="space-y-base">
                    <p class="font-headline-md text-label-sm uppercase tracking-widest text-[#ADFF2F]">PROGRESSO DA
                        COLEÇÃO</p>
                    <div class="flex items-baseline gap-xs">
                        <h2 class="font-display-xl text-headline-lg" id="progressPercent">0%</h2>
                        <p class="font-body-md text-white/60" id="progressText">0 / 0 colecionadas</p>
                    </div>
                </div>
                <div class="w-full md:w-64 h-3 bg-surface-container-highest rounded-full overflow-hidden">
                    <div class="h-full bg-[#ADFF2F]" id="progressFill" style="width: 0%"></div>
                </div>
            </div>
        </section>
        <!-- Search & Filter Bar -->
        <section class="flex flex-col md:flex-row gap-gutter">
            <div class="relative flex-grow">
                <span
                    class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline">search</span>
                <input id="searchInput"
                    class="w-full bg-surface-container border-b-2 border-white focus:border-[#ADFF2F] outline-none py-4 pl-12 pr-4 font-headline-md text-label-sm uppercase placeholder:text-outline transition-colors"
                    placeholder="BUSCAR JOGADOR OU CODIGO..." type="text" />
            </div>
            <div class="flex gap-xs">
                <button id="missingFilterBtn"
                    class="bg-surface-container border-2 border-white px-6 py-4 font-headline-md text-label-sm uppercase hover:bg-[#ADFF2F] hover:text-black transition-all">FALTANDO</button>
                <button id="foilFilterBtn"
                    class="bg-surface-container border-2 border-white px-6 py-4 font-headline-md text-label-sm uppercase hover:bg-[#ADFF2F] hover:text-black transition-all">ESPECIAIS</button>
                <button id="clearFiltersBtn"
                    class="bg-surface-container border-2 border-white px-6 py-4 font-headline-md text-label-sm uppercase hover:bg-[#ADFF2F] hover:text-black transition-all">LIMPAR</button>
                <button id="resetAlbumBtn"
                    class="bg-surface-container border-2 border-red-500 text-red-400 px-6 py-4 font-headline-md text-label-sm uppercase hover:bg-red-600 hover:text-white transition-all">RESETAR</button>
            </div>
        </section>
        <!-- Group Sections (dinamicamente preenchido via JS) -->
        <div id="groupsContainer" class="space-y-xl"></div>
    </main>

        // Estado do album: cada sticker recebe status (collected ou missing)
        let stickers = STICKERS_DB.map(s => ({ ...s, status: "missing" }));

        // Filtros ativos
        let searchQuery = "";
        let showOnlyMissing = false;
        let showOnlyFoil = false;

        // Carregar do localStorage
        function loadFromStorage() {
            const saved = localStorage.getItem("copa2026_album_status");
            if (saved) {
                try {
                    const statusMap = JSON.parse(saved);
                    stickers.forEach(s => {
                        if (statusMap[s.code] === "collected") s.status = "collected";
                        else s.status = "missing";
                    });
                } catch (e) { }
            }
        }

        function saveToStorage() {
            const statusMap = {};
            stickers.forEach(s => { statusMap[s.code] = s.status; });
            localStorage.setItem("copa2026_album_status", JSON.stringify(statusMap));
        }

        // Alternar status
        function toggleStatus(sticker) {
            if (sticker.status === "collected") {
                sticker.status = "missing";
            } else {
                sticker.status = "collected";
            }
            saveToStorage();
            updateProgressAndRender();
        }

        // Atualizar estatísticas e re-renderizar
        function updateProgressAndRender() {
            const total = stickers.length;
            const collected = stickers.filter(s => s.status === "collected").length;
            const percent = total === 0 ? 0 : Math.round((collected / total) * 100);
            document.getElementById("progressPercent").innerText = `${percent}%`;
            document.getElementById("progressText").innerHTML = `${collected} / ${total} colecionadas`;
            document.getElementById("progressFill").style.width = `${percent}%`;
            renderGroups();
        }

        // Obter stickers filtrados
        function getFilteredStickers() {
            let filtered = [...stickers];
            if (searchQuery.trim() !== "") {
                const term = searchQuery.trim().toLowerCase();
                filtered = filtered.filter(s => s.name.toLowerCase().includes(term) || s.code.toLowerCase().includes(term));
            }
            if (showOnlyMissing) {
                filtered = filtered.filter(s => s.status === "missing");
            }
            if (showOnlyFoil) {
                filtered = filtered.filter(s => s.foil === true);
            }
            return filtered;
        }

        // Renderizar grupos (seleções) dinamicamente
        function renderGroups() {
            const filteredStickers = getFilteredStickers();
            // Agrupar por país
            const groups = new Map();
            filteredStickers.forEach(s => {
                if (!groups.has(s.country)) groups.set(s.country, []);
                groups.get(s.country).push(s);
            });
            // Ordenar países
            const sortedCountries = Array.from(groups.keys()).sort();
            const container = document.getElementById("groupsContainer");
            if (!container) return;
            if (sortedCountries.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-white/50">Nenhuma figurinha encontrada</div>`;
                return;
            }
            let html = "";
            for (let country of sortedCountries) {
                const countryStickers = groups.get(country);
                const totalInCountry = countryStickers.length;
                const collectedInCountry = countryStickers.filter(s => s.status === "collected").length;
                html += `
        <section class="space-y-gutter">
          <div class="flex items-center gap-sm border-b-2 border-white pb-xs">
            <h3 class="font-display-xl text-headline-lg italic uppercase text-[#ADFF2F]">${country}</h3>
            <span class="font-body-lg text-white opacity-50">${collectedInCountry} / ${totalInCountry}</span>
          </div>
          <div class="sticker-card-grid">
      `;
                for (let sticker of countryStickers) {
                    const isCollected = sticker.status === "collected";
                    const isFoil = sticker.foil;
                    // Determinar estilos
                    let cardClasses = "flex flex-col justify-between min-h-[140px] transition-all ";
                    let borderStyle = "";
                    let buttonClasses = "";
                    let buttonText = "";
                    let iconHtml = "";
                    if (isCollected) {
                        cardClasses += "bg-surface-container border-2 border-[#ADFF2F]";
                        buttonClasses = "w-full bg-[#ADFF2F] text-black py-2 font-headline-md text-[10px] uppercase font-black border border-black mt-sm";
                        buttonText = "COLECIONADA";
                        if (isFoil) {
                            iconHtml = `<span class="material-symbols-outlined text-[#ADFF2F] text-sm" data-weight="fill">bolt</span>`;
                        } else {
                            iconHtml = `<span class="material-symbols-outlined text-[#ADFF2F] text-sm" data-weight="fill">check_circle</span>`;
                        }
                    } else {
                        cardClasses += "bg-surface-container-low border-2 border-dashed border-outline-variant opacity-70 hover:opacity-100";
                        buttonClasses = "w-full bg-transparent text-white border-2 border-white py-2 font-headline-md text-[10px] uppercase hover:bg-white hover:text-black transition-colors mt-sm";
                        buttonText = "MARCAR POSSUO";
                        if (isFoil) {
                            iconHtml = `<span class="material-symbols-outlined text-outline text-sm">bolt</span>`;
                        } else {
                            iconHtml = "";
                        }
                    }
                    html += `
          <div class="${cardClasses}" data-code="${sticker.code}">
            <div>
              <div class="flex justify-between items-start">
                <span class="font-headline-md text-label-sm ${isCollected ? 'text-[#ADFF2F]' : 'text-outline'}">${sticker.code}</span>
                ${iconHtml}
              </div>
              <p class="font-headline-md text-body-md text-white uppercase mt-xs">${escapeHtml(sticker.name)}</p>
            </div>
            <button class="${buttonClasses}" data-code="${sticker.code}">${buttonText}</button>
          </div>
        `;
                }
                html += `</div></section>`;
            }
            container.innerHTML = html;
            // Adicionar eventos aos botões
            document.querySelectorAll(".sticker-card-grid button").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const code = btn.getAttribute("data-code");
                    const sticker = stickers.find(s => s.code === code);
                    if (sticker) {
                        toggleStatus(sticker);
                    }
                });
            });
        }

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, m => m === "&" ? "&amp;" : m === "<" ? "&lt;" : "&gt;");
        }

        // Resetar album
        function resetAlbum() {
            if (confirm("Resetar álbum? Todas as figurinhas voltarão como 'faltando'.")) {
                stickers.forEach(s => s.status = "missing");
                saveToStorage();
                searchQuery = "";
                showOnlyMissing = false;
                showOnlyFoil = false;
                document.getElementById("searchInput").value = "";
                updateProgressAndRender();
            }
        }

        // Eventos e inicialização
        document.addEventListener("DOMContentLoaded", () => {
            loadFromStorage();
            updateProgressAndRender();

            const searchInput = document.getElementById("searchInput");
            const missingBtn = document.getElementById("missingFilterBtn");
            const foilBtn = document.getElementById("foilFilterBtn");
            const clearBtn = document.getElementById("clearFiltersBtn");
            const resetBtn = document.getElementById("resetAlbumBtn");

            searchInput.addEventListener("input", (e) => {
                searchQuery = e.target.value;
                renderGroups();
            });
            missingBtn.addEventListener("click", () => {
                showOnlyMissing = true;
                showOnlyFoil = false;
                renderGroups();
            });
            foilBtn.addEventListener("click", () => {
                showOnlyFoil = true;
                showOnlyMissing = false;
                renderGroups();
            });
            clearBtn.addEventListener("click", () => {
                searchQuery = "";
                showOnlyMissing = false;
                showOnlyFoil = false;
                searchInput.value = "";
                renderGroups();
            });
            resetBtn.addEventListener("click", resetAlbum);
        });
    </script>
